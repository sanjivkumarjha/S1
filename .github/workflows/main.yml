name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'wrapper'

      - name: Generate debug keystore (no env secrets required)
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" || true
          fi

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tail -100
        shell: bash

      - name: Verify debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "✅ Debug APK found at $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "❌ Debug APK missing. Searching for any APKs..."
            find app/build -name "*.apk" -type f 2>/dev/null || true
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  build-release:
    name: Build Release APK (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'wrapper'

      - name: Build release APK (unsigned)
        run: |
          # Build with debug signing as fallback so CI succeeds without release secrets
          ./gradlew :app:assembleRelease --stacktrace --no-daemon 2>&1 | tail -100 || \
          echo "Release build failed without signing; attempting with debug override..." && \
          sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debugConfig")/' app/build.gradle.kts && \
          ./gradlew :app:assembleRelease --stacktrace --no-daemon 2>&1 | tail -100
        shell: bash

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Report Build Result
        if: always()
        run: |
          echo "### 🚀 Snaper AI Assistant APK Build" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug APK**: uploaded as \`app-debug-apk\` artifact" >> $GITHUB_STEP_SUMMARY
          echo "- **Release APK**: uploaded as \`app-release-apk\` artifact (if unsigned/fallback)" >> $GITHUB_STEP_SUMMARY
          echo "- **No repository secrets required** — builds work with zero API keys or .env" >> $GITHUB_STEP_SUMMARY