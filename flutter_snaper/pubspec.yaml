name: snaper_ai_assistant
description: "A modern AI Assistant converted from Jetpack Compose."
publish_to: 'none'
version: 28.1.1+28

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  glassmorphism_ui: ^0.0.1
  flutter_animate: ^4.5.0
  http: ^1.1.0
  googleapis: ^12.0.0
  googleapis_auth: ^1.4.0
  path_provider: ^2.1.1
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png